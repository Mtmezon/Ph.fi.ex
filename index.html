<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاختبار النهائي المحاكي — الفيزياء — التحصيلي فيزياء | المتميزون</title>
<style>
:root{--b:#0b4a6d;--b2:#0e5d88;--bl:#e8f1f6;--g:#d99b14;--gl:#fbf3e0;--ink:#1d2733;--mut:#5b6876;--line:#d6dee4;--ok:#1f8a4c;--okl:#e6f5ec;--no:#c0392b;--nol:#fbeceb;--bg:#eef2f5}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Tajawal','Segoe UI','Noto Sans Arabic','Geeza Pro',Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.8;font-size:16px}
.f,.n{font-family:'Cambria Math','Times New Roman','DejaVu Serif',serif;unicode-bidi:isolate}
.n{white-space:nowrap}
.f{background:#f0f5f8;border-radius:5px;padding:0 5px;color:#0a3d5a;display:inline-block;line-height:1.6}
sup,sub{font-size:.68em;line-height:0}
.hide{display:none!important}
.page{max-width:900px;margin:0 auto;padding:20px 14px 40px}
.brand{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;border-radius:16px;padding:20px 22px;display:flex;gap:16px;align-items:center}
.brand img{height:64px;border-radius:8px}
.brand h1{margin:0;font-size:24px}.brand p{margin:2px 0 0;opacity:.92}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.card h2{margin:0 0 10px;color:var(--b);font-size:19px}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 20px;font:inherit;font-size:15.5px;cursor:pointer;font-weight:700}
.btn.g{background:var(--g)}.btn.o{background:#fff;color:var(--b);border:1.5px solid var(--b)}.btn.r{background:var(--no)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;width:min(360px,100%)}
table.t{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
table.t th{background:var(--b);color:#fff;padding:7px 9px;text-align:right;font-weight:700}
table.t td{border-bottom:1px solid var(--line);padding:7px 9px}
.note{background:var(--gl);border:1px solid #efd9a6;border-radius:12px;padding:10px 14px;font-size:14.5px}
ul.rules{margin:6px 0;padding-inline-start:22px}
/* exam */
.xbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 14px}
.xbar img{height:30px;border-radius:5px;opacity:.9}
.xbar .who{flex:1;font-size:14px;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbar .who b{color:var(--ink)}
.timer{font-family:'Courier New',monospace;font-weight:800;font-size:20px;background:#f2f5f7;border-radius:8px;padding:2px 12px;direction:ltr;border:1px solid var(--line)}
.timer.w{background:#fff4dc;color:#9a6500;border-color:#efcf86}.timer.d{background:var(--nol);color:var(--no);border-color:#efb7b0;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.6}}
.xwrap{max-width:860px;margin:0 auto;padding:16px 14px 90px}
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:6px}
.pb{height:6px;background:#dfe6eb;border-radius:9px;overflow:hidden;margin-bottom:12px}.pb i{display:block;height:100%;background:var(--b);transition:width .3s}
.qbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.qtext{font-size:18px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:center;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff;font:inherit;font-size:16.5px;cursor:pointer;text-align:right;color:inherit}
.opt:hover{border-color:#9bb6c6}
.opt .l{width:28px;height:28px;border-radius:50%;border:1.5px solid #9bb6c6;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.opt.sel{border-color:var(--b);background:var(--bl)}.opt.sel .l{background:var(--b);color:#fff;border-color:var(--b)}
.flag{background:none;border:1.5px solid var(--line);border-radius:9px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--mut)}
.flag.on{border-color:var(--g);background:var(--gl);color:#8a5a00;font-weight:700}
.xfoot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:20}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin:12px 0}
.cell{border:1.5px solid var(--line);border-radius:9px;padding:8px 0;text-align:center;cursor:pointer;background:#fff;font-weight:700;position:relative}
.cell.a{background:var(--bl);border-color:var(--b2)}
.cell.m::after{content:'⚑';position:absolute;top:-6px;left:3px;color:var(--g);font-size:14px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font:inherit;font-size:14px;cursor:pointer}
.filters button.on{background:var(--b);color:#fff;border-color:var(--b)}
.modal{position:fixed;inset:0;background:rgba(10,30,45,.45);display:grid;place-items:center;z-index:50;padding:14px}
.modal .card{max-width:440px;width:100%}
/* report */
.big{font-size:46px;font-weight:800;color:var(--b);line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#f6f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:22px;color:var(--b)}
.bar{height:10px;background:#e7edf1;border-radius:9px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%}
.pill{border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.s{background:var(--okl);color:var(--ok)}.pill.m{background:#fff4dc;color:#9a6500}.pill.w{background:var(--nol);color:var(--no)}
.lst{margin:4px 0;padding-inline-start:20px}
.rv{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;background:#fff}
.rv .h{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--mut);margin-bottom:4px}
.rv .a{font-size:15px;margin-top:6px}
.rv.ok{border-inline-start:5px solid var(--ok)}.rv.no{border-inline-start:5px solid var(--no)}.rv.sk{border-inline-start:5px solid #9aa7b1}
.exp{background:#f6f9fb;border-radius:9px;padding:7px 11px;margin-top:6px;font-size:14.5px}
.notice{border:2px solid var(--b);border-radius:16px;background:#fff;padding:0;overflow:hidden}
.notice .hd{background:var(--b);color:#fff;padding:14px 20px;display:flex;gap:12px;align-items:center}
.notice .hd img{height:44px;border-radius:6px}
.notice .bd{padding:20px}
.notice .sc{font-size:64px;font-weight:800;color:var(--b);line-height:1;text-align:center}
.ready{font-size:20px;font-weight:800;text-align:center;padding:10px;border-radius:12px;margin:8px 0}
footer{text-align:center;color:var(--mut);font-size:13.5px;padding:18px 10px}
footer a{color:var(--b);text-decoration:none;font-weight:700;direction:ltr;display:inline-block}
@media (max-width:640px){.brand{flex-direction:column;text-align:center}.qtext{font-size:17px}.big{font-size:38px}.timer{font-size:17px}.xbar .who{font-size:12.5px}}
@media print{.noprint,.xbar,.xfoot{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#bbb}.page{padding:0}}
</style>
</head>

<script>// أدوات مشتركة: عرض الصيغ والنصوص المختلطة (عربي + رموز لاتينية)
(function () {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function supsub(s) {
    let prev;
    do { prev = s; s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>'); } while (s !== prev);
    return s;
  }
  function formula(inner) {
    return '<span class="f" dir="ltr">' + supsub(inner.replace(/⇐/g, '⇒')) + '</span>';
  }
  // نص عادي (من البنك): نغلّف مقاطع الرموز والأرقام اللاتينية باتجاه LTR
  const RUN = /[A-Za-z0-9ΔμλρθαβγπΩ√½′\u0001\u0003−]+(?:[A-Za-z0-9ΔμλρθαβγπΩ√½°%·×=+−\-\/.,:|′' ()\u0001\u0002\u0003\u0004]*[A-Za-z0-9ΔμλρθαβγπΩ√½°%)\u0002\u0004])?/g;
  function plain(s) {
    s = esc(s);
    const store = [];
    s = s.replace(/(\^|_)\{([^{}]*)\}/g, (m, k, c) => { store.push([k, c]); return (k === '^' ? '\u0001' : '\u0003') + (store.length - 1) + (k === '^' ? '\u0002' : '\u0004'); });
    s = s.replace(RUN, m => {
      // وازن الأقواس
      let t = m;
      const open = (t.match(/\(/g) || []).length, close = (t.match(/\)/g) || []).length;
      let tail = '';
      if (close > open && t.endsWith(')')) { t = t.slice(0, -1); tail = ')'; }
      let head = '';
      if (open > close && t.startsWith('(')) { t = t.slice(1); head = '('; }
      if (!/[A-Za-z0-9ΔμλρθαβγπΩ√½\u0001\u0003]/.test(t)) return m;
      return head + '<span class="n" dir="ltr">' + t + '</span>' + tail;
    });
    s = s.replace(/[\u0001\u0003](\d+)[\u0002\u0004]/g, (m, i) => { const [k, c] = store[+i]; return k === '^' ? '<sup>' + c + '</sup>' : '<sub>' + c + '</sub>'; });
    return s;
  }
  // نص فيه ⟦صيغ⟧ (من الدورة أو الشروح)
  function rich(s, isHtml) {
    const parts = String(s).split(/(⟦[^⟧]*⟧)/);
    return parts.map(p => p.startsWith('⟦') ? formula(isHtml ? p.slice(1, -1) : esc(p.slice(1, -1))) : (isHtml ? p : plain(p))).join('');
  }
  window.MZ = {
    esc, plain, rich, supsub,
    html: s => rich(s, true),
    store: {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
      del(k) { try { localStorage.removeItem(k); } catch (e) { } }
    },
    shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    letters: ['أ', 'ب', 'ج', 'د']
  };
})();

 m/s^{2})",["60 m/s","30 m/s","16 m/s","180 m/s"],0,"من السكون: ⟦v_{f} = gt = 10×6 = 60 m/s⟧",8],[12,0,6,0,"جسم يبدأ بسرعة متجهة 2 m/s ويتسارع بتسارع ثابت 4 m/s^{2}. ما إزاحته خلال 3 s؟",["18 m","24 m","42 m","14 m"],1,"لا توجد سرعة نهائية، فنستعمل ⟦Δd = v_{i}t + ½at^{2} = 2×3 + ½×4×3^{2} = 24 m⟧",9],[13,0,5,0,"ما أكبر محصلة ممكنة لقوتين مقدارهما 9 N و12 N؟",["21 N","108 N","10.5 N","3 N"],0,"أكبر محصلة عندما تكون القوتان في الاتجاه نفسه: ⟦R = 9 + 12 = 21 N⟧",5],[14,0,5,1,"الدقة (Precision) في القياس تعني",["استخدام أداة غالية","تقارب نتائج القياسات المتكررة بعضها من بعض","قرب القياس من القيمة المقبولة","كثرة الأرقام بعد الفاصلة دائمًا"],1,"الدقة: تقارب القياسات المتكررة. أما الضبط فقربها من القيمة المقبولة.",10],[15,0,6,0,"تزداد السرعة المتجهة لجسم بانتظام من الصفر إلى 8 m/s خلال 2 s. ما تسارعه؟",["4 m/s^{2}","8 m/s^{2}","16 m/s^{2}","6 m/s^{2}"],0,"⟦a = Δv/Δt = (8 − 0)/2 = 4 m/s^{2}⟧",11],[16,0,6,0,"قطع جسم مسافة بسرعة 40 m/s لمدة 3 s، ثم بسرعة 10 m/s لمدة 1 s. ما متوسط سرعته؟",["130 m/s","32.5 m/s","65 m/s","25 m/s"],1,"متوسط السرعة = المسافة الكلية ÷ الزمن الكلي = ⟦(40×3 + 10×1)/(3 + 1) = 130/4 = 32.5 m/s⟧ (وليس متوسط السرعتين إلا إذا تساوى الزمنان).",12],[17,0,6,0,"تزداد السرعة المتجهة لجسم بانتظام من الصفر إلى 8 m/s خلال 5 s. ما تسارعه؟",["20 m/s^{2}","40 m/s^{2}","1.6 m/s^{2}","3 m/s^{2}"],2,"⟦a = Δv/Δt = (8 − 0)/5 = 1.6 m/s^{2}⟧",11],[18,0,6,0,"قطع جسم مسافة بسرعة 40 m/s لمدة 4 s، ثم بسرعة 10 m/s لمدة 4 s. ما متوسط سرعته؟",["200 m/s","30 m/s","25 m/s","100 m/s"],2,"متوسط السرعة = المسافة الكلية ÷ الزمن الكلي = ⟦(40×4 + 10×4)/(4 + 4) = 200/8 = 25 m/s⟧ (وليس متوسط السرعتين إلا إذا تساوى الزمنان).",12],[19,0,6,0,"قطع جسم مسافة بسرعة 30 m/s لمدة 3 s، ثم بسرعة 20 m/s لمدة 3 s. ما متوسط سرعته؟",["25 m/s","75 m/s","30 m/s","150 m/s"],0,"متوسط السرعة = المسافة الكلية ÷ الزمن الكلي = ⟦(30×3 + 20×3)/(3 + 3) = 150/6 = 25 m/s⟧ (وليس متوسط السرعتين إلا إذا تساوى الزمنان).",12],[20,0,6,0,"جسم سرعته المتجهة الابتدائية 4 m/s يتسارع بتسارع ثابت 5 m/s^{2}. ما سرعته المتجهة بع const CUR = 'mtz_phys_cur_' + CFG.mode, SEEN = 'mtz_phys_seen', HIST = 'mtz_phys_hist';

const fmtT = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

let X = S.get(CUR, null), tick = null;
const save = () => S.set(CUR, X);

// ---------- اختيار الأسئلة ----------
function build() {
  let seen = new Set(S.get(SEEN, []));
  const picked = [], usedT = new Set();
  CFG.quota.forEach((q, d) => {
    let pool = B.Q.filter(x => x[1] === d);
    let avail = pool.filter(x => !seen.has(x[0]));
    if (avail.length < q * 2) { pool.forEach(x => seen.delete(x[0])); avail = pool; }
    const wantC = Math.min(Math.ceil(q * 0.3), avail.filter(x => x[3]).length);
    const lessons = [...new Set(avail.map(x => x[2]))];
    const out = [];
    const take = (filt) => {
      const byL = {}; MZ.shuffle(avail.filter(filt)).forEach(x => (byL[x[2]] = byL[x[2]] || []).push(x));
      return byL;
    };
    // جولة المفاهيمي ثم الحسابي، بالتناوب على دروس المجال
    for (const [need, filt] of [[wantC, x => x[3] === 1], [q, x => true]]) {
      const byL = take(filt); let ls = MZ.shuffle(lessons), guard = 0;
      while (out.length < need && guard < 500) {
        guard++;
        for (const l of ls) {
          if (out.length >= need) break;
          const arr = byL[l] || [];
          while (arr.length) { const c = arr.shift(); if (!usedT.has(c[8]) && !out.includes(c)) { out.push(c); usedT.add(c[8]); break; } }
        }
        if (ls.every(l => !(byL[l] || []).length)) break;
      }
    }
    // احتياط إن نقص
    for (const c of MZ.shuffle(avail)) { if (out.length >= q) break; if (!out.includes(c)) out.push(c); }
    picked.push(...out.slice(0, q));
  });
  picked.forEach(x => seen.add(x[0])); S.set(SEEN, [...seen]);
  const qs = MZ.shuffle(picked).map(x => ({ id: x[0], perm: MZ.shuffle([0, 1, 2, 3]), ans: null, mark: false, t: 0 }));
  let k = 0;
  const secs = CFG.sections.map(s => { const r = { qs: qs.slice(k, k + s.n), left: s.min * 60, used: 0, done: false, expired: false }; k += s.n; return r; });
  return secs;
}
const Q = id => B.Q[id - 1];

// ---------- الشاشات ----------
function start() {
  if (X && X.secs && !X.finished) return resumeAsk();
  if (X && X.finished) return report();
  CFG.mode === 'final' ? entryFinal() : entryPre();
}

  return `<table class="t"><tr><th>المجال (الباب)</th><th>عدد الأسئلة</th></tr>${B.DOM.map((d, i) => `<tr><td>${d[2]}</td><td>${CFG.quota[i]}</td></tr>`).join('')}<tr><td><b>المجموع</b></td><td><b>${TOTAL}</b></td></tr></table>`;
}

      return `<tr><td>${d.name}</td><td>${pa == null ? '—' : pa + '٪'}</td><td>${pb}٪</td><td style="color:${df == null ? 'inherit' : df >= 0 ? 'var(--ok)' : 'var(--no)'};font-weight:700">${df == null ? '—' : (df > 0 ? '+' : '') + df}</td></tr>`; }).join('')}<tr><td><b>الدرجة الكلية</b></td><td>${preH.score}</td><td>${p}</td><td style="font-weight:800;color:${p - preH.score >= 0 ? 'var(--ok)' : 'var(--no)'}">${p - preH.score > 0 ? '+' : ''}${p - preH.score}</td></tr></table></div>`;
  }
  h += `<div class="card"><h2>الأداء حسب المجال</h2><table class="t"><tr><th>المجال</th><th>الوزن في الاختبار</th><th>الصحيح</th><th style="width:30%">النسبة</th></tr>${dom.map(d => `<tr><td>${d.name}</td><td>${Math.round(d.w * 100)}٪</td><td>${d.k} / ${d.n}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${d.p * 100}%;background:${color(d.p)}"></i></div><b>${Math.round(d.p * 100)}٪</b></div></td></tr>`).join('')}</table>
  <h2 style="margin-top:14px">الأداء حسب نوع السؤال</h2><table class="t"><tr><th>النوع</th><th>الصحيح</th><th>النسبة</th></tr>${typ.map(t => `<tr><td>${t.name}</td><td>${t.k} / ${t.n}</td><td>${t.n ? Math.round(100 * t.k / t.n) : 0}٪</td></tr>`).join('')}</table></div>`;
  h += `<div class="card"><h2>الأداء حسب المهارة (الدرس)</h2><div style="overflow-x:auto"><table class="t"><tr><th>الدرس</th><th>الصحيح</th><th>متوسط الزمن</th><th>الحكم</th></tr>${les.sort((a, b) => a.l - b.l).map(x => `<tr><td>${x.l}. ${x.name}</td><td>${x.k} / ${x.n}</td><td>${Math.round(x.tm)} ث</td><td><span class="pill ${x.v[1]}">${x.v[0]}</span></td></tr>`).join('')}</table></div></div>`;
  h += `<div class="card"><h2>✅ نقاط القوة (النجاحات)</h2>${strong.length ? `<ul class="lst">${strong.map(x => `<li>الدرس ${x.l}: ${x.name} — ${x.k} من ${x.n}</li>`).join('')}</ul>` : '<p style="color:var(--mut)">لا توجد مهارة بلغت 75٪ بعد؛ استمر في التدريب.</p>'}
  <h2>⚠️ نقاط الضعف (الإخفاقات)</h2>${weak.length ? `<ul class="lst">${weak.map(x => `<li>الدرس ${x.l}: ${x.name} — ${x.k} من ${x.n}</li>`).join('')}</ul>` : '<p style="color:var(--mut)">لا توجد مهارة أقل من 50٪. أحسنت!</p>'}</div>`;
  h += `<div class="card"><h2>${CFG.mode === 'final' ? '🗓 خطة المراجعة قبل الاختبار' : '🎯 على ماذا تركز خلال الدورة؟'}</h2><p style="margin-top:0;color:var(--mut);font-size:14.5px">مرتبة حسب الأولوية = نسبة الخطأ × وزن المجال في الاختبار، مع رقم الدرس وصفحته في الدليل الشامل «التحصيلي: الفيزياء».</p>
  ${focus.length ? `<table class="t"><tr><th>#</th><th>الدرس (المهارة)</th><th>الباب</th><th>صفحة الدليل</th><th>نسبة الخطأ</th></tr>${focus.map((x, i) => `<tr><td>${i + 1}</td><td>الدرس ${x.l}: ${x.name}</td><td>${B.DOM[x.dom][2]}</td><td>${x.pg}</td><td>${Math.round((1 - x.pr) * 100)}٪</td></tr>`).join('')}</table>` : '<p>أجبت عن كل الأسئلة إجابة صحيحة. راجع ورقة القوانين وحافظ على مستواك.</p>'}
  ${CFG.mode === 'final' ? `<h2 style="margin-top:12px">نصائح ليوم الاختبار</h2><ul class="lst"><li>نم جيدًا ليلة الاختبار، واحضر قبل موعدك بوقت كافٍ ومعك الهوية.</li><li>وزّع وقتك: نحو دقيقة للسؤال، ولا تعلق عند سؤال واحد؛ ضع علامة وارجع إليه.</li><li>اكتب المعطيات بالرموز واختر القانون الذي يحتوي المعطى والمطلوب فقط، وافحص الوحدة.</li><li>لا درجة سالبة: لا تترك سؤالًا دون إجابة، واستبعد الخيارات غير المعقولة فيزيائيًا.</li><li>راجع ورقة القوانين في اليوم الأخير بدل حل مسائل جديدة صعبة.</li></ul>` : ''}</div>`;
  h += `<div class="card"><h2>⏱ تحليل إدارة الوقت</h2><table class="t"><tr><th>القسم</th><th>الزمن المتاح</th><th>الزمن المستغرق</th><th>المتروكة</th><th>الحالة</th></tr>${X.secs.map((s, i) => `<tr><td>القسم ${i + 1}</td><td>${CFG.sections[i].min} دقيقة</td><td>${fmtT(s.used)}</td><td>${s.qs.filter(q => q.ans == null).length}</td><td>${s.expired ? '<span class="pill w">انتهى الوقت قبل الإنهاء</span>' : '<span class="pill s">أُنهي في الوقت</span>'}</td></tr>`).join('')}</table>
  <p>متوسط زمن السؤال: <b>${Math.round(all.reduce((s, a) => s + a.t, 0) / n)} ثانية</b> (المعدل الرسمي نحو 68 ثانية). الأسئلة التي تجاوزت دقيقتين: <b>${slow.length}</b>${slow.length ? ` (${slow.map(a => 'سؤال ' + (all.indexOf(a) + 1)).join('، ')})` : ''}.</p></div>`;
  if (prev.length) {
    h += `<div class="card"><h2>📊 محاولاتك السابقة على هذا الجهاز</h2><table class="t"><tr><th>التاريخ</th><th>النوع</th><th>الدرجة</th></tr>${prev.slice(-8).reverse().map(x => `<tr><td>${dstr(x.date)}</td><td>${x.mode === 'pre' ? 'قبلي' : 'نهائي محاكٍ'}</td><td>${x.score} / 100</td></tr>`).join('')}<tr><td colspan="2"><b>المحاولة الحالية</b></td><td><b>${p} / 100</b></td></tr></table></div>`;
  }
  const fl = all.map((a, i) => [a, i]).filter(([a]) => filter === 'all' || (filter === 'no' && a.ans != null && !a.ok) || (filter === 'sk' && a.ans == null) || (filter === 'ok' && a.ok));
  h += `<div class="card"><h2>مراجعة الإجابات</h2><div class="filters row noprint">${[['no', 'الخاطئة'], ['sk', 'المتروكة'], ['ok', 'الصحيحة'], ['all', 'الكل']].map(([k, t]) => `<button data-rf="${k}" class="${filter === k ? 'on' : ''}">${t}</button>`).join('')}</div>
  ${fl.map(([a, i]) => { const d = a.d; const yours = a.ans == null ? 'لم تُجب' : L[a.perm.indexOf(a.ans)] + ') ' + MZ.plain(d[5][a.ans]); const right = L[a.perm.indexOf(d[6])] + ') ' + MZ.plain(d[5][d[6]]);
    return `<div class="rv ${a.ans == null ? 'sk' : a.ok ? 'ok' : 'no'}"><div class="h"><b>سؤال ${i + 1}</b> • القسم ${a.si + 1} • الدرس ${d[2]}: ${B.LES[d[2]][0]} • ${d[3] ? 'مفاهيمي' : 'حسابي'}</div><div>${MZ.plain(d[4])}</div>
    <div class="a">إجابتك: <b style="color:${a.ok ? 'var(--ok)' : 'var(--no)'}">${yours}</b> &nbsp;|&nbsp; الصحيحة: <b style="color:var(--ok)">${right}</b></div><div class="exp">${MZ.rich(d[7])}</div></div>`; }).join('') || '<p style="color:var(--mut)">لا توجد أسئلة في هذا التصنيف.</p>'}</div>${foot}</div>`;
  app.innerHTML = h; window.scrollTo(0, filter === 'no' && !report._once ? 0 : window.scrollY); report._once = true;
  app.querySelectorAll('[data-rf]').forEach(b => b.onclick = () => { const y = window.scrollY; report(b.dataset.rf); window.scrollTo(0, y); });
  document.getElementById('again').onclick = () => { S.del(CUR); X = null; start(); };
}
function histOnly() {
  const h = S.get(HIST, []);
  app.innerHTML = `<div class="page">${brand('نتائجي السابقة على هذا الجهاز')}<div class="card"><table class="t"><tr><th>التاريخ</th><th>الاسم</th><th>النوع</th><th>الدرجة</th></tr>${h.slice().reverse().map(x => `<tr><td>${dstr(x.date)}</td><td>${MZ.esc(x.name)}</td><td>${x.mode === 'pre' ? 'قبلي' : 'نهائي محاكٍ'}</td><td>${x.score} / 100</td></tr>`).join('')}</table><button class="btn" id="b">رجوع</button></div>${foot}</div>`;
  document.getElementById('b').onclick = start;
}
start();
</script>
</body>
</html>
